[project]
name = "rsr"
version = "0.1.0"
description = "Contrastive-SDF measurement of reward-seeking before and after RL (Olmo 3 32B Think)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "transformers>=4.51",
    "peft>=0.14",
    "accelerate>=0.30",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "safetensors",
    "pyyaml",
    "numpy",
    "wandb",
]

[project.optional-dependencies]
gpu = ["vllm>=0.10.2; sys_platform == 'linux'", "ninja", "liger-kernel", "bitsandbytes"]
dev = ["pytest"]

[project.scripts]
rsr = "rsr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsr"]

[tool.pytest.ini_options]
markers = ["gpu: needs a CUDA GPU and model downloads"]
addopts = "-m 'not gpu'"
